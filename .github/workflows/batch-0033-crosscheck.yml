# Batch 0033, cell 10: LARQL's trace table against the exact per-layer decomposition (V6), and the rotary-base control.
# Read-only. Written down in docs/batches/0033.md, amendment 7.
name: batch 0033 crosscheck

on:
  push:
    branches: ["batch/0033-**"]
    paths: [".github/workflows/batch-0033-crosscheck.yml", "batches/0033/crosscheck.py", "batches/0033/larql/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: batch-0033-crosscheck-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  HF_HUB_DISABLE_TELEMETRY: "1"
  HF_HUB_DISABLE_PROGRESS_BARS: "1"
  LMNF_THREADS: "4"

jobs:
  crosscheck:
    name: "10 V6 and the rotary control"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install the Python packages
        run: |
          python -m pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --quiet transformers "numpy>=2" scipy safetensors huggingface_hub
          mkdir -p out work && python -m pip freeze > out/versions.txt
      - name: The release and the 1920k checkpoint
        run: |
          hf download HuggingFaceTB/SmolLM2-135M --revision 93efa2f097d58c2a74874c7e644dbc9b0cee75a2 --local-dir work/final --exclude "onnx/*" --exclude "*.gguf" >/dev/null
          hf download HuggingFaceTB/SmolLM2-135M-intermediate-checkpoints --revision step-1920000 --local-dir work/s1920000 --exclude "onnx/*" --exclude "*.gguf" >/dev/null
          sha256sum work/final/model.safetensors work/s1920000/model.safetensors | tee out/inputs.sha256
          cat batches/0033/larql/revision.txt batches/0033/larql/larql-version.txt
      - name: V6, LARQL's table against the exact decomposition
        run: python batches/0033/crosscheck.py v6 work/final out/v6.json 2>&1 | tail -n 8
      - name: V7, LARQL's INFER route against the tensors and the exact contributions
        run: python batches/0033/crosscheck.py route work/final out/route.json 2>&1 | tail -n 6
      - name: The rotary-base control
        run: |
          python batches/0033/crosscheck.py rope work/final final 100000 out/rope_final_100000.json 2>&1 | tail -n 3
          python batches/0033/crosscheck.py rope work/final final 10000 out/rope_final_10000.json 2>&1 | tail -n 3
          python batches/0033/crosscheck.py rope work/s1920000 s1920000 10000 out/rope_s1920000_10000.json 2>&1 | tail -n 3
          python batches/0033/crosscheck.py rope work/s1920000 s1920000 100000 out/rope_s1920000_100000.json 2>&1 | tail -n 3
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: batch-0033-crosscheck
          path: out/
          retention-days: 1
