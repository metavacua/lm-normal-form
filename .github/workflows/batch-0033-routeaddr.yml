# Batch 0033, cell 13: LARQL's INFER route as discrete weight addresses in the safetensors, the ONNX export and the GGUF.
# Read-only. Written down in docs/batches/0033.md, amendment 12.
name: batch 0033 routeaddr

on:
  push:
    branches: ["batch/0033-**"]
    paths: [".github/workflows/batch-0033-routeaddr.yml", "batches/0033/routeaddr.py", "batches/0033/larql/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: batch-0033-routeaddr-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  HF_HUB_DISABLE_TELEMETRY: "1"
  HF_HUB_DISABLE_PROGRESS_BARS: "1"
  MODEL: HuggingFaceTB/SmolLM2-135M
  HF_REVISION: 93efa2f097d58c2a74874c7e644dbc9b0cee75a2
  LLAMACPP_TAG: b11450
  LMNF_THREADS: "4"

jobs:
  routeaddr:
    name: "13 the INFER route as weight addresses"
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install the Python packages
        run: |
          python -m pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --quiet transformers "numpy>=2" scipy safetensors huggingface_hub onnx onnxruntime "optimum[onnxruntime]" sentencepiece protobuf pyoxigraph
          git clone --quiet --depth 1 --branch "$LLAMACPP_TAG" https://github.com/ggml-org/llama.cpp llama.cpp-src
          python -m pip install --quiet ./llama.cpp-src/gguf-py
          mkdir -p out work && python -m pip freeze > out/versions.txt
      - name: The model at the registered revision
        run: |
          hf download "$MODEL" --revision "$HF_REVISION" --local-dir work/model --exclude "onnx/*" --exclude "*.gguf" >/dev/null
          sha256sum work/model/model.safetensors | tee out/inputs.sha256
      - name: The ONNX export and the GGUF (float32)
        run: |
          optimum-cli export onnx --model work/model --task text-generation work/onnx 2>&1 | tail -n 4
          python llama.cpp-src/convert_hf_to_gguf.py work/model --outfile work/model.gguf --outtype f32 2>&1 | tail -n 3
      - name: Cell 13, the route as addresses
        run: python batches/0033/routeaddr.py work/model work/onnx work/model.gguf out 2>&1 | tail -n 8
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: batch-0033-routeaddr
          path: out/
          retention-days: 1
