# Batch 0033, cell 15: synthetic output rows (built locally, batches/0033/synthetic_rows_*.json) applied by address in the safetensors file, the ONNX
# export and the GGUF, and verified by PyTorch, ONNX Runtime and llama.cpp. Written down in docs/batches/0033.md, amendment 16.
name: batch 0033 synth

on:
  push:
    branches: ["batch/0033-**"]
    paths: [".github/workflows/batch-0033-synth.yml", "batches/0033/synth.py", "batches/0033/synth_common.py", "batches/0033/synthetic_rows_*.json", "batches/0033/llamacpp/lmnf_logits.cpp"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: batch-0033-synth-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  HF_HUB_DISABLE_TELEMETRY: "1"
  HF_HUB_DISABLE_PROGRESS_BARS: "1"
  LLAMACPP_TAG: b11450
  LLAMACPP_SHA256: a9a5c229a56ff61be66ad5ae0ddb2051201dbc091ccda1062553fbdf1152adc1

jobs:
  synth:
    name: "15 synthetic rows in three encodings, ${{ matrix.tag }}"
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - tag: base135
            model: HuggingFaceTB/SmolLM2-135M
            revision: 93efa2f097d58c2a74874c7e644dbc9b0cee75a2
          - tag: instruct135
            model: HuggingFaceTB/SmolLM2-135M-Instruct
            revision: 12fd25f77366fa6b3b4b768ec3050bf629380bac
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install the Python packages and the pinned llama.cpp release
        run: |
          python -m pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --quiet transformers "numpy>=2" safetensors huggingface_hub onnx onnxruntime "optimum[onnxruntime]" sentencepiece protobuf
          curl -sSL -o l.tgz "https://github.com/ggml-org/llama.cpp/releases/download/$LLAMACPP_TAG/llama-$LLAMACPP_TAG-bin-ubuntu-x64.tar.gz"
          echo "$LLAMACPP_SHA256  l.tgz" | sha256sum -c -
          tar xzf l.tgz
          git clone --quiet --depth 1 --branch "$LLAMACPP_TAG" https://github.com/ggml-org/llama.cpp llama.cpp-src
          python -m pip install --quiet ./llama.cpp-src/gguf-py
          g++ -O2 -std=c++17 -I llama.cpp-src/include -I llama.cpp-src/ggml/include -I llama.cpp-src/vendor batches/0033/llamacpp/lmnf_logits.cpp \
            -o "llama-$LLAMACPP_TAG/lmnf-logits" -L"llama-$LLAMACPP_TAG" -lllama -lggml -lggml-base "-Wl,-rpath,\$ORIGIN"
          mkdir -p out work && python -m pip freeze > out/versions.txt
      - name: The model at the registered revision
        run: |
          hf download "${{ matrix.model }}" --revision "${{ matrix.revision }}" --local-dir work/model --exclude "onnx/*" --exclude "*.gguf" >/dev/null
          sha256sum work/model/model.safetensors batches/0033/synthetic_rows_${{ matrix.tag }}.json | tee out/inputs.sha256
      - name: The ONNX export and the GGUF (float32)
        run: |
          optimum-cli export onnx --model work/model --task text-generation work/onnx 2>&1 | tail -n 4
          python llama.cpp-src/convert_hf_to_gguf.py work/model --outfile work/model.gguf --outtype f32 2>&1 | tail -n 3
          ls -la work/onnx work/model.gguf
      - name: Cell 15, the synthetic rows under the three evaluators
        run: python batches/0033/synth.py work/model ${{ matrix.tag }} batches/0033/synthetic_rows_${{ matrix.tag }}.json work/onnx/model.onnx work/model.gguf "llama-$LLAMACPP_TAG/lmnf-logits" out 2>&1 | tail -n 40
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: batch-0033-synth-${{ matrix.tag }}
          path: |
            out/*.json
            out/*.txt
            out/*.sha256
          retention-days: 1
