# Two existing linters, on every pull request and on main.
name: licence and workflow lint

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: licences and workflows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: "reuse: every file states its licence"
        run: pipx run reuse lint
      - name: "actionlint: the workflows are well formed"
        if: always()
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:latest -color
