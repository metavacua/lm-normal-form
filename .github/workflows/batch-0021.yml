# Batch 0021: the gauges of a whole Llama-style decoder as theorems of Lean 4 with Mathlib (the model defined with arbitrary nonlinearities; the function of a layer, the stream and the cache, the
# logits), on top of the library of batch 0020. Written down in docs/batches/0021.md. The Lean project is that of batch 0020 (batches/0020); this batch adds modules to it. The toolchain is the Lean of the
# author's machine (4.34.1) and Mathlib at its tag v4.34.1; nothing here is built on that machine.
name: batch 0021

on:
  push:
    branches: ["batch/0021-**"]
    paths: [".github/workflows/batch-0021.yml", "batches/0020/**", "batches/0021/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: batch-0021-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lean:
    name: "01 the theorems, checked by Lean"
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - id: build
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: batches/0020
          build: true
      - name: The axioms that each theorem depends on
        if: always() && steps.build.outcome == 'success'
        working-directory: batches/0020
        run: |
          mkdir -p ../../out/lean
          lake env lean LmnfProofs/Axioms.lean 2>&1 | tee ../../out/lean/axioms.txt
          lake env lean LmnfProofs/Axioms21.lean 2>&1 | tee ../../out/lean/axioms21.txt
          if grep -q sorryAx ../../out/lean/axioms.txt ../../out/lean/axioms21.txt; then echo 'a theorem depends on sorry'; exit 1; fi
          want=$(grep -c '^#print axioms' LmnfProofs/Axioms21.lean)
          got=$(grep -c -E 'depends on axioms|does not depend on any axioms' ../../out/lean/axioms21.txt)
          echo "$got of $want theorems of batch 0021 listed"
          test "$got" -eq "$want"
          test "$(grep -c -E 'depends on axioms|does not depend on any axioms' ../../out/lean/axioms.txt)" -eq 17
      - name: Grade the registered claims
        if: always() && steps.build.outcome == 'success'
        run: python3 batches/0021/grade21.py out/lean/axioms21.txt batches/0021/claims21.tsv out/lean --measured docs/batches/0019/results/toy.json
      - name: Keep the manifest and the versions
        if: always()
        working-directory: batches/0020
        run: |
          mkdir -p ../../out/lean
          cp lake-manifest.json ../../out/lean/ 2>/dev/null || true
          { lean --version; lake --version; } 2>&1 | tee ../../out/lean/versions.txt || true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: lean-proofs-0021
          path: out/lean/
          retention-days: 14
