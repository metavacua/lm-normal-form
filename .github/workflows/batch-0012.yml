# Batch 0012: the version fields of an ONNX file, and what reads them. The graph Optimum exports, changed in one version-bearing
# field at a time (ir_version, opset_import, the other header fields, onnx.version_converter), given to onnx.checker and to
# ONNX Runtime, against the predictions of batches/0012/predictions.tsv; the export repeated under other arguments and
# environments; the graph ONNX Runtime saves after optimizing it. Written down in docs/batches/0012.md.
#
# One job per model, one after the other: the tiny random Llama first (the smoke, no claim), then SmolLM2-135M-Instruct.
name: batch 0012

on:
  push:
    branches: ["batch/0012-**"]
    paths: [".github/workflows/batch-0012.yml", "batches/0012/**"]
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: batch-0012-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  HF_HUB_DISABLE_TELEMETRY: "1"
  HF_HUB_DISABLE_PROGRESS_BARS: "1"
  # The token ids of each prompt in batches/0010/prompts.txt, one line per prompt, comma separated.
  TOKENS: >-
    import sys,transformers as t;k=t.AutoTokenizer.from_pretrained(sys.argv[1]);
    [print(','.join(map(str,k(l.rstrip('\n')).input_ids)))for l in open(sys.argv[2])]

jobs:
  versions:
    name: "01 the version fields of ${{ matrix.tag }}"
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: true
      max-parallel: 1
      matrix:
        include:
          - { tag: tiny, model: "hf-internal-testing/tiny-random-LlamaForCausalLM" }
          - { tag: smol, model: "HuggingFaceTB/SmolLM2-135M-Instruct" }
    env:
      MODEL: ${{ matrix.model }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install
        run: |
          mkdir -p out/${{ matrix.tag }} work/${{ matrix.tag }}
          o=out/${{ matrix.tag }}
          test -x /usr/bin/time || sudo apt-get install --yes time
          python -m pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --quiet "optimum[onnxruntime]" numpy cbor2 safetensors
          python -m pip freeze > $o/versions.txt
          nproc | tee $o/nproc.txt
          grep -m1 'model name' /proc/cpuinfo | tee $o/cpu.txt
          free -g | tee $o/memory.txt
          df -h / | tee $o/disk-before.txt
          wc -c batches/0012/*.py batches/0012/*.tsv batches/0012/cells.sh | tee $o/code-sizes.txt
          curl -sS "https://huggingface.co/api/models/$MODEL" | jq -r .sha | tee $o/revision.txt
      - name: "The harness on a toy graph and a change that is not a row"
        run: python batches/0012/onnx_matrix.py selftest | tee out/${{ matrix.tag }}/selftest.txt
      - id: export
        name: "optimum-cli: export to ONNX, without past, as batches 0010 and 0011"
        continue-on-error: true
        run: bash batches/0011/cells.sh export ${{ matrix.tag }}
      - id: tokens
        name: "the token ids of the prompts, by the model's own tokenizer"
        if: steps.export.outcome == 'success'
        continue-on-error: true
        run: bash batches/0011/cells.sh tokens ${{ matrix.tag }}
      - id: matrix
        name: "one version-bearing field changed at a time: the checker, ONNX Runtime, the prediction"
        if: steps.tokens.outcome == 'success'
        continue-on-error: true
        run: bash batches/0012/cells.sh matrix ${{ matrix.tag }}
      - id: saved
        name: "the graph ONNX Runtime saves after optimizing it"
        if: steps.tokens.outcome == 'success'
        continue-on-error: true
        run: bash batches/0012/cells.sh saved ${{ matrix.tag }}
      - id: exports
        name: "the export repeated under other arguments and environments"
        if: steps.tokens.outcome == 'success'
        continue-on-error: true
        run: bash batches/0012/cells.sh exports ${{ matrix.tag }}
      - name: What the run used
        if: always()
        run: |
          df -h / | tee out/${{ matrix.tag }}/disk-after.txt
          grep -h "Maximum resident\|Elapsed (wall" out/${{ matrix.tag }}/*.log 2>/dev/null | head -4 || true
      - name: Outcomes of the observations
        if: always()
        env:
          STEPS: ${{ toJSON(steps) }}
        run: echo "$STEPS" | tee out/${{ matrix.tag }}/outcomes.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: versions-${{ matrix.tag }}
          path: out/${{ matrix.tag }}/
          retention-days: 7

  report:
    # A commit status named after the batch, so that the pull request's checks tab shows the batch run itself.
    name: report the batch run on the commit
    needs: [versions]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RESULTS: ${{ toJSON(needs) }}
    steps:
      - run: |
          state=success; echo "$RESULTS" | jq -e '[.[] | .result] | all(. == "success")' > /dev/null || state=failure
          gh api "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -f state="$state" -f context="batch 0012" \
            -f description="$(echo "$RESULTS" | jq -r 'to_entries | map("\(.key) \(.value.result)") | join(", ")' | cut -c1-140)" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > /dev/null
