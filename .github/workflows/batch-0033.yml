# Batch 0033: the algebra of the path through a weight and principled substitutes. Written down in docs/batches/0033.md.
# verify  cell 0V, first and a gate: are the isolated variables the correct ones.
# record  cell 05: the IO characterization record, base and Instruct, with the ONNX and GGUF encodings; then the comparison.
# (the substitution cells follow only after the verification and the record have been read)
name: batch 0033

on:
  push:
    branches: ["batch/0033-**"]
    paths: [".github/workflows/batch-0033.yml", "batches/0033/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: batch-0033-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  HF_HUB_DISABLE_TELEMETRY: "1"
  HF_HUB_DISABLE_PROGRESS_BARS: "1"
  MODEL: HuggingFaceTB/SmolLM2-135M
  HF_REVISION: 93efa2f097d58c2a74874c7e644dbc9b0cee75a2
  LMNF_THREADS: "4"

jobs:
  verify:
    name: "0V the isolated variables are the correct ones"
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install the Python packages
        run: |
          python -m pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --quiet transformers "numpy>=2" scipy safetensors huggingface_hub
          mkdir -p out work && python -m pip freeze > out/versions.txt
      - name: The model at the registered revision
        run: |
          hf download "$MODEL" --revision "$HF_REVISION" --local-dir work/model --exclude "onnx/*" --exclude "*.gguf" >/dev/null
          sha256sum work/model/model.safetensors | tee out/inputs.sha256
      - name: Cell 0V
        run: python batches/0033/verify.py work/model /dev/null out/verify.json 2>&1 | tail -n 14
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: batch-0033-verify
          path: out/
          retention-days: 1

  record:
    name: "05 the IO record of ${{ matrix.name }}"
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: base
            model: HuggingFaceTB/SmolLM2-135M
            revision: 93efa2f097d58c2a74874c7e644dbc9b0cee75a2
          - name: instruct
            model: HuggingFaceTB/SmolLM2-135M-Instruct
            revision: 12fd25f77366fa6b3b4b768ec3050bf629380bac
    env:
      LLAMACPP_TAG: b11450
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install the Python packages
        run: |
          python -m pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --quiet transformers "numpy>=2" scipy safetensors huggingface_hub onnx onnxruntime "optimum[onnxruntime]" sentencepiece protobuf pyoxigraph
          git clone --quiet --depth 1 --branch "$LLAMACPP_TAG" https://github.com/ggml-org/llama.cpp llama.cpp-src
          python -m pip install --quiet ./llama.cpp-src/gguf-py
          mkdir -p out work && python -m pip freeze > out/versions.txt
      - name: The model at the registered revision
        run: |
          hf download "${{ matrix.model }}" --revision "${{ matrix.revision }}" --local-dir work/model --exclude "onnx/*" --exclude "*.gguf" >/dev/null
          sha256sum work/model/model.safetensors | tee out/inputs.sha256
      - name: The ONNX export and the GGUF (float32), the two other encodings
        run: |
          optimum-cli export onnx --model work/model --task text-generation work/onnx 2>&1 | tail -n 4
          python llama.cpp-src/convert_hf_to_gguf.py work/model --outfile work/model.gguf --outtype f32 2>&1 | tail -n 3
          find work/onnx work/model.gguf -maxdepth 1 -type f -printf "%s %p\n"
      - name: Cell 05, the records
        run: python batches/0033/record.py work/model "${{ matrix.name }}" work/onnx work/model.gguf "out/${{ matrix.name }}" France Spain 2>&1 | tail -n 12
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: batch-0033-record-${{ matrix.name }}
          path: out/
          retention-days: 1

  compare:
    name: "05 the same prompts across the two models"
    runs-on: ubuntu-latest
    needs: record
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          pattern: batch-0033-record-*
          path: out/
      - run: |
          mkdir -p cmp/base cmp/instruct
          cp out/batch-0033-record-base/base/*.json cmp/base/ && cp out/batch-0033-record-instruct/instruct/*.json cmp/instruct/
          python batches/0033/compare.py cmp | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: batch-0033-compare
          path: cmp/compare.json
          retention-days: 1
