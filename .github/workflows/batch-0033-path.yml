# Batch 0033, cell 06: the isolation of the IO path, verified by sufficiency of the masked forward, on three models of
# two depths. Written down in docs/batches/0033.md, amendment 3.
name: batch 0033 path

on:
  push:
    branches: ["batch/0033-**"]
    paths: [".github/workflows/batch-0033-path.yml", "batches/0033/path.py", "batches/0033/pathcompare.py", "batches/0033/core.py"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: batch-0033-path-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  HF_HUB_DISABLE_TELEMETRY: "1"
  HF_HUB_DISABLE_PROGRESS_BARS: "1"
  LMNF_THREADS: "4"

jobs:
  path:
    name: "06 the path of ${{ matrix.name }}"
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: base
            model: HuggingFaceTB/SmolLM2-135M
            revision: 93efa2f097d58c2a74874c7e644dbc9b0cee75a2
          - name: instruct
            model: HuggingFaceTB/SmolLM2-135M-Instruct
            revision: 12fd25f77366fa6b3b4b768ec3050bf629380bac
          - name: 360M
            model: HuggingFaceTB/SmolLM2-360M
            revision: f8027fd0eaeea54caa13c31d31b9fdc459c38b49
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install the Python packages
        run: |
          python -m pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --quiet transformers "numpy>=2" safetensors huggingface_hub
          mkdir -p out work && python -m pip freeze > out/versions.txt
      - name: The model at the registered revision
        run: |
          hf download "${{ matrix.model }}" --revision "${{ matrix.revision }}" --local-dir work/model --exclude "onnx/*" --exclude "*.gguf" >/dev/null
          sha256sum work/model/model.safetensors | tee out/inputs.sha256
      - name: Cell 06, the isolation
        run: python batches/0033/path.py work/model "${{ matrix.name }}" "out/${{ matrix.name }}" France Spain 2>&1 | tail -n 12
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: batch-0033-path-${{ matrix.name }}
          path: out/
          retention-days: 1

  compare:
    name: "06 the same prompts across the three models"
    runs-on: ubuntu-latest
    needs: path
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: python -m pip install --quiet "numpy>=2"
      - uses: actions/download-artifact@v7
        with:
          pattern: batch-0033-path-*
          path: art/
      - run: |
          mkdir -p root
          for n in base instruct 360M; do mkdir -p "root/$n"; cp art/batch-0033-path-$n/$n/*.json "root/$n/"; done
          python batches/0033/pathcompare.py root | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: batch-0033-pathcompare
          path: root/pathcompare.json
          retention-days: 1
