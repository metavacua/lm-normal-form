# Batch 0033, cell 08: the needle by structure, searched where the model is decisively right. Read-only.
# Written down in docs/batches/0033.md, amendment 5.
name: batch 0033 needle

on:
  push:
    branches: ["batch/0033-**"]
    paths: [".github/workflows/batch-0033-needle.yml", "batches/0033/needle.py"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: batch-0033-needle-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  HF_HUB_DISABLE_TELEMETRY: "1"
  HF_HUB_DISABLE_PROGRESS_BARS: "1"
  LMNF_THREADS: "4"

jobs:
  needle:
    name: "08 the needle in ${{ matrix.name }}"
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: base135
            model: HuggingFaceTB/SmolLM2-135M
            revision: 93efa2f097d58c2a74874c7e644dbc9b0cee75a2
          - name: instruct135
            model: HuggingFaceTB/SmolLM2-135M-Instruct
            revision: 12fd25f77366fa6b3b4b768ec3050bf629380bac
          - name: instruct360
            model: HuggingFaceTB/SmolLM2-360M-Instruct
            revision: a10cc1512eabd3dde888204e902eca88bddb4951
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install the Python packages
        run: |
          python -m pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --quiet transformers "numpy>=2" scipy safetensors huggingface_hub
          mkdir -p out work && python -m pip freeze > out/versions.txt
      - name: The model at the registered revision
        run: |
          hf download "${{ matrix.model }}" --revision "${{ matrix.revision }}" --local-dir work/model --exclude "onnx/*" --exclude "*.gguf" >/dev/null
          sha256sum work/model/model.safetensors | tee out/inputs.sha256
      - name: Cell 08, the structural needle
        run: python batches/0033/needle.py work/model "${{ matrix.name }}" "out/${{ matrix.name }}" 2>&1 | tail -n 16
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: batch-0033-needle-${{ matrix.name }}
          path: out/
          retention-days: 1
