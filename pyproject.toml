[project]
name = "lmnf"
version = "0.0.0"
description = "Tooling for the lm-normal-form experiments"
requires-python = ">=3.11"
license = "AGPL-3.0-or-later"
dependencies = ["numpy", "onnx", "pyoxigraph"]

# One extra per kind of experiment, named as the batch files name them.
[project.optional-dependencies]
test = ["pytest", "duckdb"]
structure = ["huggingface_hub", "onnxruntime", "torch", "transformers"]
forward = ["duckdb"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
