# The shadow stack in linear memory is 64 KiB (rustc's default for the wasm targets is 1 MiB, wasm-ld's own is 64 KiB; the target
# puts it first, so that an overflow leaves the memory and traps) and the memory declares a maximum of 64 pages = 4 MiB, so that
# the bound is a property of the module and not of the host that runs it. Every warning is an error.
[target.wasm32v1-none]
rustflags = [
  "-D",
  "warnings",
  "-C",
  "link-arg=-zstack-size=65536",
  "-C",
  "link-arg=--max-memory=4194304",
]
