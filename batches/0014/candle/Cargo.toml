[package]
name = "lmnf-candle"
version = "0.1.0"
edition = "2021"
publish = false
description = "The candle runtime of batch 0014: logits, greedy generation, perplexity and speed of a Llama checkpoint in a Hugging Face directory"

[dependencies]
candle-core = "=0.11.0"
candle-nn = "=0.11.0"
candle-transformers = "=0.11.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"

[profile.release]
opt-level = 3
debug = false
